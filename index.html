<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QFF Lab Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECF0F3; --surface:#FFFFFF; --ink:#16202B; --muted:#5B6773; --line:#D3DAE0;
  --b1:#2F6FB3; --b2:#2E8B6A; --b3:#B4562E; --group:#2F6FB3;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --surface:#18212A; --ink:#E7ECF0; --muted:#9AA6B1; --line:#2B3741;
    --b1:#6FA6E0; --b2:#5CC29C; --b3:#E58A62; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#18212A; --ink:#E7ECF0; --muted:#9AA6B1; --line:#2B3741;
  --b1:#6FA6E0; --b2:#5CC29C; --b3:#E58A62; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
h1,h2{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--b1);outline-offset:3px;border-radius:6px}
.home h1{font-size:2.2rem;line-height:1.1;margin:18px 0 8px;font-weight:800;letter-spacing:-0.02em}
.home p{color:var(--muted);margin:0 0 14px}
h2{font-size:1.3rem;margin:28px 0 10px;font-weight:800}
.hero{background:var(--group);color:#fff;border-radius:22px;padding:22px;margin-top:8px}
.hero .kicker{font-size:.95rem;opacity:.9;margin:0 0 4px}
.hero h1{margin:0;font-size:3.2rem;line-height:.95;font-weight:800;letter-spacing:-0.03em}
.hero p{margin:10px 0 0;font-size:1rem;opacity:.95}
.now{margin:18px 0 6px;background:var(--surface);border:2px solid var(--group);border-radius:16px;padding:14px 16px}
.now small{color:var(--muted);display:block}
.now strong{font-size:1.2rem}
ol.tl{list-style:none;margin:18px 0 0;padding:0}
.slot{display:grid;grid-template-columns:62px 1fr;gap:12px}
.time{font-variant-numeric:tabular-nums;font-weight:700;padding-top:12px;font-size:1rem}
.time small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.card{background:var(--surface);border-radius:14px;padding:12px 14px;border-left:6px solid var(--bc,var(--line));margin:4px 0}
.card .lab{font-size:1.08rem;font-weight:700;line-height:1.3}
.card .inst{color:var(--muted);font-size:.92rem}
.card .bat{font-size:.92rem;margin-top:4px}
.card .bat a{font-weight:700}
.slot.current .card{box-shadow:0 0 0 3px var(--group)}
.slot.done{opacity:.5}
.move{margin:2px 0 2px 74px;font-size:.9rem;color:var(--muted);padding-left:14px;border-left:2px dotted var(--line)}
.move.big{color:var(--ink);font-weight:700}
.places{display:grid;gap:10px}
.place{background:var(--surface);border-radius:14px;padding:12px 14px;border-left:6px solid var(--bc)}
.place b{display:block}
.place span{color:var(--muted);font-size:.92rem;display:block}
.place a{display:inline-block;margin-top:6px;font-weight:700}
.big-time{background:var(--surface);border-radius:16px;padding:16px;margin-top:18px;border-left:6px solid var(--b3)}
.big-time b{display:block;font-size:2rem;font-family:"Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums;line-height:1.1}
.big-time span{color:var(--muted)}
ul.rules{padding-left:20px;margin:0}
ul.rules li{margin-bottom:6px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const BUILDINGS = {
  57:{name:"Pfaffenwaldring 57", sub:"PI5 and PI1, University of Stuttgart", addr:"Pfaffenwaldring 57, 70569 Stuttgart", c:"var(--b1)"},
  13:{name:"Allmandring 13", sub:"PI3 and ZAQuant, University of Stuttgart", addr:"Allmandring 13, 70569 Stuttgart", c:"var(--b2)"},
  19:{name:"ARENA2036", sub:"Quix Arena", addr:"ARENA2036, Pfaffenwaldring 19, 70569 Stuttgart", c:"var(--b3)"}
};
const mapUrl = b => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(BUILDINGS[b].addr);
const LABS = {
  1:{nom:"The Quantum Länd", inst:"5th Institute of Physics (PI5)", bat:57},
  2:{nom:"Rubidium Ion Microscope", inst:"5th Institute of Physics (PI5)", bat:57},
  3:{nom:"QNN", inst:"5th Institute of Physics (PI5)", bat:57},
  4:{nom:"Hot Vapor Cells", inst:"5th Institute of Physics (PI5)", bat:57},
  5:{nom:"Cooling Systems", inst:"1st Institute of Physics (PI1)", bat:57},
  6:{nom:"ZAQuant Cleanroom", inst:"3rd Institute of Physics (PI3)", bat:13},
  7:{nom:"NV-Diamond-Based Scanning Probe", inst:"3rd Institute of Physics (PI3)", bat:13},
  8:{nom:"NV-Diamond-Based Magnetocardiography", inst:"3rd Institute of Physics (PI3)", bat:13},
  9:{nom:"Tin-Vacancy (SnV−) Centers in Diamond for Quantum Networks", inst:"3rd Institute of Physics (PI3)", bat:13}
};
/* Lab tour: 9 visits of 15 min, 5 min to move */
const SLOTS = [["15:30","15:45"],["15:50","16:05"],["16:10","16:25"],["16:30","16:45"],["16:50","17:05"],
  ["17:10","17:25"],["17:30","17:45"],["17:50","18:05"],["18:10","18:25"]];
const plan = g => Array.from({length:9},(_,t)=>((g-1+t)%9)+1);
const GROUPS = {1:{c:"#C62E3A",n:"red"},2:{c:"#D9661F",n:"orange"},3:{c:"#A8860A",n:"yellow"},
  4:{c:"#2E8540",n:"green"},5:{c:"#11818A",n:"teal"},6:{c:"#2B5FB8",n:"blue"},
  7:{c:"#6B44B5",n:"purple"},8:{c:"#C23C86",n:"pink"},9:{c:"#4F5B66",n:"grey"}};
/* Quix Arena: 8 visits of 15 min, back to back */
const ARENA = [["15:30","15:45"],["15:45","16:00"],["16:00","16:15"],["16:15","16:30"],
  ["16:30","16:45"],["16:45","17:00"],["17:00","17:15"],["17:15","17:30"]];

const app = document.getElementById("app");
const toMin = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };

function placesHtml(list){
  let h = `<h2>${list.length>1?"Locations":"Location"}</h2><div class="places">`;
  for (const b of list){
    const B = BUILDINGS[b];
    h += `<div class="place" style="--bc:${B.c}"><b>${B.name}</b><span>${B.sub}</span><span>${B.addr}</span>
      <a href="${mapUrl(b)}" target="_blank" rel="noopener">Open in Google Maps ↗</a></div>`;
  }
  return h + `</div>`;
}
function home(){
  document.title = "QFF Lab Tour";
  document.documentElement.style.removeProperty("--group");
  app.innerHTML = `<section class="home"><h1>QFF Lab Tour</h1>
    <p>Your place was given at the welcome desk. Scan the QR code on your badge or ticket to see your personal schedule.</p>
    <p>No badge or ticket? Please ask a member of staff.</p></section>${placesHtml([57,13,19])}`;
}
function group(g){
  const G = GROUPS[g], p = plan(g), n = nowMin();
  document.title = `Group ${g}, QFF Lab Tour`;
  document.documentElement.style.setProperty("--group", G.c);
  let cur = -1; SLOTS.forEach((s,i)=>{ if(n>=toMin(s[0]) && n<toMin(s[1])) cur=i; });
  const first = LABS[p[0]];
  let h = `<section class="hero"><p class="kicker">QFF Lab Tour</p><h1>Group ${g}</h1>
    <p>${G.n[0].toUpperCase()+G.n.slice(1)} badge. Meet at 15:30 at <b>${first.nom}</b>, ${BUILDINGS[first.bat].name}.</p></section>`;
  if (cur>=0) h += `<div class="now"><small>Right now, until ${SLOTS[cur][1]}</small><strong>${LABS[p[cur]].nom}, ${BUILDINGS[LABS[p[cur]].bat].name}</strong></div>`;
  h += `<ol class="tl">`;
  p.forEach((l,i)=>{
    if (i>0){
      const pb = LABS[p[i-1]].bat, nb = LABS[l].bat;
      h += nb!==pb ? `<li class="move big">5 min: walk to ${BUILDINGS[nb].name}</li>` : `<li class="move">5 min to your next lab</li>`;
    }
    const L = LABS[l], B = BUILDINGS[L.bat], s = SLOTS[i];
    const cls = ["slot", i===cur?"current":"", (cur>=0 && i<cur)?"done":""].join(" ");
    h += `<li class="${cls}"><div class="time">${s[0]}<small>${s[1]}</small></div>
      <div class="card" style="--bc:${B.c}"><div class="lab">${L.nom}</div><div class="inst">${L.inst}</div>
      <div class="bat">${B.name} · <a href="${mapUrl(L.bat)}" target="_blank" rel="noopener">Map ↗</a></div></div></li>`;
  });
  h += `</ol><h2>How it works</h2><ul class="rules">
    <li>Each visit lasts 15 minutes. You then have 5 minutes to reach your next lab.</li>
    <li>Stay together with your group: everyone with the same badge colour follows the same schedule.</li>
    <li>At the end of each visit, the lab host will let you know it’s time to move on.</li>
    <li>Lost or running late? Ask any staff member and show them this page.</li></ul>${placesHtml([57,13])}`;
  app.innerHTML = h;
}
function arena(k){
  const s = ARENA[k-1], n = nowMin();
  document.title = `Quix Arena, slot ${k}`;
  document.documentElement.style.setProperty("--group", "#B4562E");
  let status = "";
  if (n>=toMin(s[0]) && n<toMin(s[1])) status = `<div class="now"><small>Happening now</small><strong>Your Quix Arena visit is in progress</strong></div>`;
  app.innerHTML = `<section class="hero"><p class="kicker">QFF Lab Tour</p><h1>Quix Arena</h1>
    <p>Visit slot ${k} of 8, at ARENA2036.</p></section>${status}
    <div class="big-time"><span>Your visit</span><b>${s[0]} to ${s[1]}</b><span>Please arrive at ${String(Math.floor((toMin(s[0])-5)/60)).padStart(2,"0")}:${String((toMin(s[0])-5)%60).padStart(2,"0")}, 5 minutes early.</span></div>
    <h2>How it works</h2><ul class="rules">
    <li>Visits run back to back and start exactly on time, so please wait at the ARENA2036 entrance before your slot.</li>
    <li>Each visit is for a group of 8 and lasts 15 minutes.</li>
    <li>ARENA2036 is on the eastern side of the campus. Allow enough time to walk there.</li>
    <li>Questions? Ask any staff member and show them this page.</li></ul>${placesHtml([19])}`;
}
function route(){
  const h = location.hash;
  let m;
  if ((m = h.match(/^#groupe-([1-9])$/))) group(+m[1]);
  else if ((m = h.match(/^#arena-([1-8])$/))) arena(+m[1]);
  else home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
