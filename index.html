<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qiskit Fall Fest 2026, Lab Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F4; --surface:#FFFFFF; --ink:#161616; --muted:#6F6F6F; --line:#C6C6C6;
  --pink:#EE5396; --accent:#0F62FE;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0B0B0B; --surface:#1C1C1C; --ink:#F4F4F4; --muted:#A8A8A8; --line:#393939; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0B0B0B; --surface:#1C1C1C; --ink:#F4F4F4; --muted:#A8A8A8; --line:#393939; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.hero{background:#000;color:#fff;padding:20px 20px 22px;border-bottom:6px solid var(--accent)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand svg{width:40px;height:40px;flex:none}
.brand span{color:var(--pink);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;line-height:1.3}
.hero h1{margin:0;font-size:2.6rem;line-height:1;font-weight:700;letter-spacing:-0.02em}
.hero .inst{margin:8px 0 0;color:#C6C6C6;font-size:1rem}
.chip{display:inline-block;margin-top:14px;background:var(--accent);color:#fff;font-weight:600;padding:4px 12px;font-size:.95rem}
.meet{background:var(--surface);margin-top:16px;padding:16px;border-left:6px solid var(--pink)}
.meet small{display:block;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.meet b{display:block;font-size:1.9rem;line-height:1.15;font-variant-numeric:tabular-nums}
.meet p{margin:6px 0 0}
.meet a{font-weight:600}
h2{font-size:1.15rem;margin:26px 0 8px;font-weight:700}
ol.tl{list-style:none;margin:0;padding:0}
.slot{display:grid;grid-template-columns:58px 1fr;gap:12px}
.time{font-variant-numeric:tabular-nums;font-weight:700;padding-top:12px}
.time small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.card{background:var(--surface);padding:12px 14px;border-left:6px solid var(--accent);margin:4px 0}
.card .lab{font-weight:700;font-size:1.05rem;line-height:1.3}
.card .where{color:var(--muted);font-size:.92rem}
.slot.current .card{box-shadow:0 0 0 3px var(--pink)}
.slot.done{opacity:.5}
.move{margin:2px 0 2px 70px;font-size:.88rem;color:var(--muted);padding-left:14px;border-left:2px dotted var(--line)}
.now{background:var(--surface);border:2px solid var(--pink);padding:12px 14px;margin-top:16px}
.now small{color:var(--muted);display:block}
ul.rules{padding-left:20px;margin:0}
ul.rules li{margin-bottom:6px}
.foot{margin-top:28px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header class="hero" id="hero"></header>
<main class="wrap" id="app"></main>
<script>
const LOGO = '<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#EE5396" d="M16,31.36C7.53,31.36.64,24.47.64,16c0-3.04.89-5.88,2.42-8.27.03-.08.08-.17.17-.26C5.99,3.35,10.69.64,16,.64c8.47,0,15.36,6.89,15.36,15.36,0,3.04-.89,5.88-2.42,8.27-.03.08-.08.17-.17.26-2.76,4.11-7.45,6.83-12.77,6.83ZM4.65,25.24c2.69,3.3,6.78,5.4,11.35,5.4s8.64-2.1,11.33-5.38c-.84.26-2.11.52-4.04.73-.22.79-.94,1.37-1.79,1.37-.75,0-1.4-.45-1.69-1.09-1.23.06-2.51.09-3.81.09-3.27,0-8.66-.26-11.35-1.12ZM21.5,24.36c-.63,0-1.14.51-1.14,1.14s.51,1.14,1.14,1.14,1.14-.51,1.14-1.14-.51-1.14-1.14-1.14ZM3.83,24.14c.69.59,4.87,1.5,12.17,1.5,1.24,0,2.46-.03,3.64-.08,0-.02,0-.04,0-.06,0-.61.29-1.15.75-1.49l-.95-1.58c-1.06-.05-2.2-.07-3.44-.07-7.8,0-12.04,1.04-12.26,1.64.03.05.06.09.09.14ZM21.5,23.64c.94,0,1.73.71,1.84,1.62,3.44-.39,4.62-.95,4.87-1.2.02-.02.03-.05.05-.08-.14-.46-2.87-1.23-7.96-1.51l.73,1.22c.15-.04.3-.06.46-.06ZM19.86,21.74c3.61.19,7.6.66,8.77,1.64,1.14-1.94,1.85-4.18,1.98-6.56-1.62.82-5.62,1.21-9.1,1.39l-.04-.72c6.27-.33,8.93-1.1,9.16-1.52v-.02c-.36-.63-5.75-1.61-14.64-1.61-.19,0-.38,0-.56,0l4.43,7.38ZM1.38,16.83c.13,2.38.84,4.61,1.98,6.56,1.64-1.36,8.69-1.75,12.64-1.75.88,0,1.91.02,3,.06l-2.01-3.35c-.33,0-.66,0-.99,0-.54,0-11.62-.02-14.62-1.53ZM1.36,16.03c.36.63,5.75,1.61,14.64,1.61.19,0,.38,0,.56,0l-4.43-7.38c-3.61-.19-7.59-.66-8.77-1.64-1.14,1.94-1.85,4.18-1.98,6.56,1.62-.82,5.62-1.21,9.1-1.39l.04.72c-6.27.33-8.93,1.1-9.16,1.52,0,0,0,.01,0,.02ZM16,13.64c.54,0,11.62.02,14.62,1.53-.13-2.38-.84-4.61-1.98-6.56-1.63,1.36-8.69,1.75-12.64,1.75-.88,0-1.91-.02-3-.06l2.01,3.35c.33,0,.66,0,.99,0ZM12.56,9.57c1.06.05,2.2.07,3.44.07,7.8,0,12.04-1.04,12.26-1.64-.03-.05-.06-.09-.09-.14-.69-.59-4.87-1.51-12.17-1.51-1.24,0-2.46.03-3.64.09v.05c0,.61-.29,1.15-.75,1.49l.95,1.58ZM3.74,8.01c.14.46,2.87,1.23,7.96,1.52l-.73-1.22c-.15.04-.3.06-.46.06-.95,0-1.73-.71-1.85-1.62-3.43.39-4.62.95-4.87,1.2-.02.03-.03.05-.05.08ZM10.5,5.36c-.63,0-1.14.51-1.14,1.14s.51,1.14,1.14,1.14,1.14-.51,1.14-1.14-.51-1.14-1.14-1.14ZM16,5.64c3.27,0,8.66.26,11.35,1.12-2.69-3.3-6.78-5.4-11.35-5.4S7.36,3.46,4.67,6.74c.84-.26,2.11-.52,4.04-.73.22-.79.94-1.37,1.79-1.37.75,0,1.4.45,1.69,1.09,1.23-.06,2.51-.09,3.81-.09Z"/></svg>';
const ROUNDS = [["15:30","15:50"],["15:55","16:15"],["16:20","16:40"],["16:45","17:05"]];
const ROUNDS5 = ROUNDS.concat([["17:10","17:30"]]);
const CYC4 = {1:[1,2,3,4],2:[2,3,4,1],3:[3,4,1,2],4:[4,1,2,3]};
const INST = {
  pi5:{title:"PI5", name:"5th Institute of Physics", color:"#0F62FE", mode:"rotation", rounds:ROUNDS, plan:CYC4, size:10,
    meet:"the blue elevator, 3rd floor", building:"Pfaffenwaldring 57", addr:"Pfaffenwaldring 57, 70569 Stuttgart",
    labs:[["Hot Vapor Cells","3rd floor, blue elevator"],["Quantum Network Nodes (QNN)","4th floor, blue elevator"],
          ["Ion Microscope","4th floor, blue elevator"],["The Quantum Länd","5th floor, blue elevator"]]},
  pi3:{title:"PI3", name:"3rd Institute of Physics", color:"#8A3FFC", mode:"rotation", rounds:ROUNDS5, size:8,
    plan:{1:[1,2,3,4,0],2:[2,3,4,0,1],3:[3,4,0,1,2],4:[4,0,1,2,3],5:[0,1,2,3,4]},
    meet:"outside the building", building:"Allmandring 13", addr:"Allmandring 13, 70569 Stuttgart",
    labs:[["ZAQuant Cleanroom","Allmandring 13"],["NV-Diamond-Based Scanning Probe","Allmandring 13"],
          ["Tin-Vacancy (SnV−) Centers in Diamond for Quantum Networks","Allmandring 13"],["NV-Diamond-Based Magnetocardiography","Allmandring 13"]]},
  pi1:{title:"PI1", name:"1st Institute of Physics", color:"#007D79", mode:"single", lab:"Cooling Systems", size:10,
    meet:"the green elevator, 3rd floor", building:"Pfaffenwaldring 57", addr:"Pfaffenwaldring 57, 70569 Stuttgart"},
  quix:{title:"Quix Arena", name:"ARENA2036", color:"#D02670", mode:"single", lab:"Quix Arena", size:10,
    meet:"the entrance of ARENA2036", building:"ARENA2036, Pfaffenwaldring 19", addr:"ARENA2036, Pfaffenwaldring 19, 70569 Stuttgart"}
};
const hero = document.getElementById("hero"), app = document.getElementById("app");
const toMin = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
const fmt = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const mapUrl = a => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a);
const brand = `<div class="brand">${LOGO}<span>Qiskit Fall Fest 2026<br>Lab Tours, Monday 9 November</span></div>`;

function home(){
  document.title = "Qiskit Fall Fest 2026, Lab Tours";
  document.documentElement.style.setProperty("--accent","#EE5396");
  hero.innerHTML = `${brand}<h1>Lab Tours</h1><p class="inst">University of Stuttgart, Campus Vaihingen</p>`;
  app.innerHTML = `<div class="meet"><small>Your tour</small><p>Your institute and group were drawn at random and are printed on your card. Scan the QR code on your card to see where to go and when.</p></div>
    <p class="foot">No card? Please ask a member of the organizing team.</p>`;
}
function page(key,g){
  const I = INST[key], n = new Date().getHours()*60 + new Date().getMinutes();
  document.title = `${I.title}, Group ${g}, Qiskit Fall Fest 2026`;
  document.documentElement.style.setProperty("--accent", I.color);
  hero.innerHTML = `${brand}<h1>${I.title}</h1><p class="inst">${I.name}${I.title===I.name?"":""}, ${I.building}</p><span class="chip">Group ${g} of ${I.mode==="rotation" ? Object.keys(I.plan).length : 4}</span>`;
  let h = "";
  if (I.mode === "rotation"){
    const R = I.rounds, p = I.plan[g];
    const used = p.map((l,i)=>l?i:-1).filter(i=>i>=0), first = used[0], last = used[used.length-1];
    const arrive = fmt(toMin(R[first][0])-5);
    h += `<div class="meet"><small>Meeting point</small><b>${arrive}</b>
      <p>Be at <strong>${I.meet}</strong>, ${I.building}. Your guide will call <strong>Group ${g}</strong> and take you to your first lab.</p>
      <p><a href="${mapUrl(I.addr)}" target="_blank" rel="noopener">Open in Google Maps ↗</a></p></div>`;
    let cur=-1; R.forEach((r,i)=>{ if(n>=toMin(r[0]) && n<toMin(r[1])) cur=i; });
    if (cur>=0 && cur>=first && cur<=last) h += `<div class="now"><small>Right now, until ${R[cur][1]}</small><strong>${p[cur] ? I.labs[p[cur]-1][0] : "Free slot: wait outside the building"}</strong></div>`;
    h += `<h2>Your visits</h2><ol class="tl">`;
    let prevShown = false;
    for (let i=first;i<=last;i++){
      const r = R[i], l = p[i];
      if (prevShown) h += `<li class="move">5 min ${l ? "to your next lab" : "break"}</li>`;
      const cls = ["slot", i===cur?"current":"", (cur>=0&&i<cur)?"done":""].join(" ");
      h += l ? `<li class="${cls}"><div class="time">${r[0]}<small>${r[1]}</small></div><div class="card"><div class="lab">${I.labs[l-1][0]}</div><div class="where">${I.labs[l-1][1]}</div></div></li>`
             : `<li class="${cls}"><div class="time">${r[0]}<small>${r[1]}</small></div><div class="card" style="border-left-color:var(--line)"><div class="lab">Free slot</div><div class="where">Wait ${I.meet}, ${I.building}. Your guide will collect your group for the next visit.</div></div></li>`;
      prevShown = true;
    }
    h += `</ol><h2>Good to know</h2><ul class="rules">
      <li>Each visit lasts 20 minutes, with 5 minutes to move to the next lab.</li>
            <li>Please stay with your group of ${I.size}.</li>
      <li>Please stay with your group of ${I.size} and your guide.</li>
      <li>Your tour ends at ${R[last][1]}.</li></ul>`;
  } else {
    const r = ROUNDS[g-1], arrive = fmt(toMin(r[0])-5);
    h += `<div class="meet"><small>Please arrive at</small><b>${arrive}</b>
      <p>Wait at <strong>${I.meet}</strong>, ${I.building}. Your visit to <strong>${I.lab}</strong> runs from <strong>${r[0]} to ${r[1]}</strong>.</p>
      <p><a href="${mapUrl(I.addr)}" target="_blank" rel="noopener">Open in Google Maps ↗</a></p></div>
      <h2>All four groups</h2><ol class="tl">`;
    ROUNDS.forEach((rr,i)=>{
      const mine = i===g-1;
      h += `<li class="slot ${mine?"current":"done"}"><div class="time">${rr[0]}<small>${rr[1]}</small></div><div class="card"><div class="lab">Group ${i+1}${mine?" (your group)":""}</div><div class="where">${I.lab}</div></div></li>`;
    });
    h += `</ol><h2>Good to know</h2><ul class="rules">
      <li>The four groups visit one after the other, 20 minutes each. Please come at your own time, not earlier.</li>
      <li>A guide will meet your group at ${I.meet}.</li>
            <li>Please stay with your group of 10.</li>
      <li>Please stay with your group of ${I.size} and your guide.</li></ul>`;
  }
  h += `<p class="foot">Questions on the day? Ask any member of the Qiskit Fall Fest team.</p>`;
  app.innerHTML = h;
}
function route(){
  const m = location.hash.match(/^#(pi5|pi3|pi1|quix)-([1-5])$/);
  const ok = m && (INST[m[1]].mode==="rotation" ? INST[m[1]].plan[+m[2]] : +m[2]<=4);
  if (ok) page(m[1], +m[2]); else home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
